name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI uses the deterministic offline provider; no Gemini key required.
  AI_PROVIDER: mock
  SESSION_SECRET: ci-local-secret-not-for-production
  SESSION_COOKIE_SECURE: "false"
  ENABLE_DEV_SEED: "true"
  LOCAL_DB_PATH: .localdata/ci.db
  CI: "true"

jobs:
  verify:
    name: Lint, typecheck, unit tests, e2e, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  gemini-integration:
    name: Live Gemini integration (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only when a dedicated key is configured; ordinary CI never needs it.
    if: ${{ vars.GEMINI_INTEGRATION_ENABLED == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Gemini integration tests
        run: npm run test:integration
        env:
          AI_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
